name: Daily Blog Publish

# 매일 아침 예약 큐(apps/docs/blog-queue/)를 훑어, 발행일이 된 글을 content/blog로
# 옮기고 커밋·푸시한다. 푸시되면 Vercel이 자동 배포 → 글이 hanui.io에 등장.
# 재고(남은 예약글)가 부족하면 GitHub 이슈로 알린다.

on:
  schedule:
    # GitHub 스케줄러는 cron 시각보다 늦게 실행을 만든다(실측 +3h59m ~ **+8h45m**, 2026-11-13~17).
    # 이 최대치는 관측할수록 커졌다 — 11-13에 +5h27m, 11-15에 +6h07m, 11-17에 +8h45m.
    # 지연 상한을 가정하는 계산은 다시 깨질 수 있다고 보고 읽어야 한다.
    # 분 0은 전 세계가 쓰는 혼잡 지점이라 더 밀리므로 0에서 떼어 둔다.
    # 스크립트는 발행일(KST)이 된 글만 옮기므로 여러 번 돌아도 안전하다(date <= today).
    #
    # 두 번을 12시간 떼어 두는 이유 — 2026-11-16에 예약 두 번이 **모두** 건너뛰어져
    # 11-17 글이 발행되지 않았다. 그때는 00:19·02:41 KST로 2h22m 간격이었다.
    # 스케줄러가 한 시간대를 버리면 그 안의 예약은 같이 죽는다. 좁은 창에 몰아 넣은
    # 이중화는 이중화가 아니다. 수를 늘리는 것(세 번·네 번)이 아니라 거리를 벌리는 문제다.
    #
    # 당길 수 있는 바닥은 00:00 KST(= 15:00 UTC). 스크립트가 날짜를 KST 달력일로
    # 판정하므로 자정 전에 돌면 '어제'로 보고 오늘 글을 올리지 않는다.
    # 둘 다 같은 KST 날짜 안에서 돌아야 하므로 뒤쪽은 12:19 KST가 상한에 가깝다.
    # 대체 실행이 KST 날짜를 넘기려면 11h41m 밀려야 한다 — 관측 최대 8h45m에 대해 여유 2h56m.
    # (11-13에 적었던 "여유 5h34m"은 그때의 최대치 6h07m 기준이었고 이미 깨졌다.
    #  그래도 시각을 또 당기지는 않는다 — 관측 하나에 일정을 매번 흔드는 것이야말로
    #  "수를 늘리는" 반사다. 여유가 음수가 되면 그때 옮긴다.)
    - cron: '19 15 * * *' # 15:19 UTC = 00:19 KST — 본 실행 (지연 시 04:19~09:04)
    - cron: '19 3 * * *' # 03:19 UTC = 12:19 KST — 앞 실행이 건너뛰어졌을 때 (지연 시 16:19~21:04)
  workflow_dispatch: {} # 수동 실행(테스트)용

permissions:
  contents: write # 발행 커밋 푸시
  issues: write # 재고 부족 알림 이슈

concurrency:
  group: daily-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 발행 대상 선별 및 이동
        id: publish
        run: node scripts/publish-due-posts.mjs

      - name: 커밋 & 푸시
        if: steps.publish.outputs.published_count != '0'
        env:
          COUNT: ${{ steps.publish.outputs.published_count }}
          TITLES: ${{ steps.publish.outputs.published_titles }}
          REMAINING: ${{ steps.publish.outputs.remaining }}
        run: |
          git config user.name "hanui-bot"
          git config user.email "actions@github.com"
          git add -A
          # 남은 편수를 제목에 넣는다 — 이슈 알림을 놓쳐도 커밋 목록에서 재고가 보이게
          git commit -m "publish: 예약 글 ${COUNT}편 발행 (남은 ${REMAINING}편) — ${TITLES}"
          git push

      # 늦은 발행 보고. 스크립트가 date <= today로 집기 때문에 밀린 글은 조용히
      # 따라잡히고 끝난다 — 2026-11-16에 예약 두 번이 다 건너뛰어진 걸 사람이 보고 알았다.
      # 늦게라도 돌았으면 늦었다고 말하게 둔다. (실행이 아예 없는 경우는 Vercel Cron
      # 감시가 본다 — apps/docs/src/app/api/cron/blog-watch. 같은 스케줄러에 올리면
      # 같은 이유로 같이 죽으므로 일부러 다른 곳에 뒀다.)
      - name: 늦은 발행 보고
        if: steps.publish.outputs.late_count != '0' && steps.publish.outputs.late_count != ''
        env:
          GH_TOKEN: ${{ github.token }}
          LATE_COUNT: ${{ steps.publish.outputs.late_count }}
          LATE_DETAIL: ${{ steps.publish.outputs.late_detail }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh label create "blog-publish-missed" --color D73A4A \
            --description "예약 발행이 빠진 날 (부재 감지)" 2>/dev/null || true
          NUM=$(gh issue list --state open --label "blog-publish-missed" --json number --jq '.[0].number // empty')
          BODY=$(printf '%s\n\n%s\n\n%s' \
            "방금 실행이 **발행일이 지난 글 ${LATE_COUNT}편**을 따라잡았습니다 — ${LATE_DETAIL}" \
            "그만큼 **발행 실행이 없었던 날이 있었다**는 뜻입니다. Actions 탭에서 그 날짜의 예약 실행이 목록에 아예 없는지(스케줄러가 건너뜀) 아니면 빨간색인지(평소 실패) 확인하세요." \
            "실행 기록: ${RUN_URL}")

          if [ -z "$NUM" ]; then
            gh issue create --title "🚨 블로그 예약 발행이 빠졌습니다 (${LATE_COUNT}편 뒤늦게 따라잡음)" \
              --label "blog-publish-missed" --body "$BODY"
            echo "늦은 발행 알림 이슈를 새로 열었다(${LATE_COUNT}편)."
          else
            gh issue comment "$NUM" --body "$BODY"
            echo "열린 이슈 #${NUM}에 늦은 발행을 기록했다(${LATE_COUNT}편)."
          fi

      # 재고 알림. 열린 이슈가 있으면 건너뛰던 예전 방식은, 이슈를 한 번 안 닫으면
      # 그 뒤로 영영 알림이 오지 않았다(2026-07-01 이슈가 11-16까지 열린 채 알람이 죽어 있었다).
      # 그래서 재고가 회복되면 스스로 닫고, 부족한 동안은 현재 편수로 갱신한다.
      - name: 재고 알림 (열기·갱신·닫기)
        env:
          GH_TOKEN: ${{ github.token }}
          REMAINING: ${{ steps.publish.outputs.remaining }}
          LOW_STOCK: ${{ steps.publish.outputs.low_stock }}
        run: |
          gh label create "blog-restock" --color FBCA04 --description "블로그 예약글 재고 알림" 2>/dev/null || true
          NUM=$(gh issue list --state open --label "blog-restock" --json number --jq '.[0].number // empty')
          TITLE="📝 블로그 예약글 재고 부족 (남은 ${REMAINING}편)"
          BODY=$(printf '%s\n\n%s' \
            "예약 큐(apps/docs/blog-queue/)에 남은 글이 **${REMAINING}편**이에요. 글을 더 써서 큐에 쟁여두면(프론트매터 date를 미래 발행일로) 발행일에 자동으로 올라갑니다. 자세히는 apps/docs/blog-queue/README.md 참고." \
            "재고가 3편 이상으로 회복되면 이 이슈는 **자동으로 닫힙니다.** 직접 닫지 않아도 돼요.")

          if [ "$LOW_STOCK" = "true" ]; then
            if [ -z "$NUM" ]; then
              gh issue create --title "$TITLE" --label "blog-restock" --body "$BODY"
              echo "재고 알림 이슈를 새로 열었다(남은 ${REMAINING}편)."
            else
              gh issue edit "$NUM" --title "$TITLE" --body "$BODY"
              gh issue comment "$NUM" --body "오늘 기준 남은 예약글 **${REMAINING}편**."
              echo "열린 이슈 #${NUM}을 현재 편수로 갱신했다."
            fi
          else
            if [ -n "$NUM" ]; then
              gh issue comment "$NUM" --body "재고가 **${REMAINING}편**으로 회복돼 자동으로 닫습니다."
              gh issue close "$NUM"
              echo "재고 회복(${REMAINING}편) — 이슈 #${NUM}을 닫았다."
            else
              echo "재고 ${REMAINING}편 — 알림 없음."
            fi
          fi
