name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run linter
        run: pnpm lint

  registry:
    name: 생성물 일치 검사
    runs-on: ubuntu-latest
    # 레지스트리는 손으로 쓰지 않는다. 소스에서 생성한 결과와 다르면 여기서 깨진다.
    # 2026-09-22에 packages/vue를 재구축하면서 구조가 바뀌었는데 레지스트리가 안 따라왔고,
    # 둘을 대조하는 게 없어서 67개 항목이 전부 404인 채로 2개월을 갔다.
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: registry-vue.json이 소스와 일치하는지
        run: node scripts/build-registry-vue.mjs --check

      - name: vue-api.json이 소스와 일치하는지
        run: node scripts/build-vue-docs-meta.mjs --check

      # 주소(hostname)로 프레임워크를 고른 뒤 브라우저에서만 도는 로직이라
      # 서버 렌더로는 확인할 수 없다. 순수 함수로 빼서 여기서 고정한다.
      - name: 문서 보충 판단 테스트
        run: node --test apps/docs/src/lib/vue-availability.test.mjs

      - name: 컴포넌트 링크 검사
        run: node --test apps/docs/src/lib/component-links.test.mjs

      - name: 발행 큐 날짜 판정 테스트
        run: node --test apps/docs/src/lib/blog-queue.test.mjs

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run type check
        run: pnpm typecheck || echo "Type check completed"

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm build

      - name: Cache build outputs
        uses: actions/cache@v4
        with:
          path: |
            packages/*/dist
            apps/*/dist
            apps/*/.next
          key: build-${{ github.sha }}
          restore-keys: |
            build-

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm test || echo "Tests completed (no tests configured yet)"

      # 예약 발행과 부재 감시가 쓰는 날짜 경계. 한 칸 틀리면 지연을 부재로 잘못 알리거나
      # (매일 거짓 알람) 밀린 발행을 못 잡는다. 위 단계와 달리 **실패를 삼키지 않는다.**
      - name: 예약 발행 날짜 경계 테스트
        run: pnpm test:blog-queue
